$kind: http-request
name: localhost:3000/auth/register
description: ""
url: localhost:3000/auth/register
method: POST
body:
  type: json
  content: |-
    {
        "username" : "shaana45",
        "email" : "shaana@45.com",
        "password" : "shaana45"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const cookieHeader = pm.response.headers.get('Set-Cookie');
      pm.test("Auth token cookie is set", function () {
          pm.expect(cookieHeader).to.include('token=');
      });
      if (cookieHeader) {
          const match = cookieHeader.match(/token=([^;]+)/);
          if (match) {
              pm.collectionVariables.set('auth_token', match[1]);
              console.log('✅ Auth token stored in collection variable: auth_token');
          }
      }
